<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>スターと 低ポリゴン版（ためし）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <!-- 会話ウィンドウ・タイトル・セッティングの 見た目は 2D 版（START）と 同じ style.css -->
  <link rel="stylesheet" href="style.css">
  <style>
    .lid { position: absolute; left: 0; right: 0; height: 0; background: #151f10; pointer-events: none; }
    #lidTop { top: 0; } #lidBot { bottom: 0; }
    #screen.auto #lpBadge { display: none; }
    /* アラームを 止めるように さそう エフェクト */
    #alarmGuide { position: absolute; width: 11em; height: 11em; margin: -5.5em 0 0 -5.5em; border: none; padding: 0;
      background: transparent; cursor: pointer; z-index: 15; }
    #alarmGuide.hidden { display: none; }
    #alarmGuide::before, #alarmGuide::after { content: ''; position: absolute; inset: 2.5em; border-radius: 50%;
      border: .5em solid rgba(255, 214, 90, .95); animation: alarmPulse 1s ease-out infinite; }
    #alarmGuide::after { animation-delay: .5s; }
    #alarmGuide span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap;
      color: #fff; background: rgba(21, 31, 16, .85); padding: .3em .8em; border-radius: .5em; font-size: 2em; }
    @keyframes alarmPulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    #lpBadge { position: absolute; left: 1.5%; bottom: 2.5%; color: #fff; background: rgba(21,31,16,.8);
      padding: .4em .9em; border-radius: .4em; font-size: 1.6em; pointer-events: none; }
  </style>
</head>
<body>
  <div id="screen">
    <canvas id="canvas"></canvas>
    <div id="lidTop" class="lid"></div>
    <div id="lidBot" class="lid"></div>
    <div id="fade"></div>

    <div id="dialog" class="hidden">
      <div id="speaker"></div>
      <img id="face" class="hidden" alt="">
      <div id="text"></div>
      <div id="choices"></div>
      <div id="nextMark">▶</div>
    </div>

    <div id="lpBadge">低ポリゴン版（ためし）</div>
    <button id="alarmGuide" class="hidden" aria-label="アラームを とめる"><span>タップして とめる</span></button>

    <div id="title" class="overlay">
      <div id="menu">
        <button id="startBtn" class="menuBtn">スタート</button>
        <button id="settingBtn" class="menuBtn">セッティング</button>
        <button id="autoBtn" class="menuBtn">オートで みる</button>
      </div>
      <p class="howto">↑ ↓ ← → キー・ゆびで なぞる：あるく　／　クリック・タップ・Enter：すすむ・えらぶ</p>
    </div>

    <div id="settings" class="hidden">
      <div class="setRow" style="top: 30%">
        <span class="setLabel">BGM</span>
        <button class="dot" data-key="bgm" data-level="0" aria-label="BGM 小"></button>
        <button class="dot" data-key="bgm" data-level="1" aria-label="BGM 中"></button>
        <button class="dot" data-key="bgm" data-level="2" aria-label="BGM 大"></button>
      </div>
      <div class="setRow" style="top: 47.2%">
        <span class="setLabel">SE volume</span>
        <button class="dot" data-key="se" data-level="0" aria-label="SE 小"></button>
        <button class="dot" data-key="se" data-level="1" aria-label="SE 中"></button>
        <button class="dot" data-key="se" data-level="2" aria-label="SE 大"></button>
      </div>
      <button id="backBtn">back</button>
    </div>

    <div id="ending" class="overlay hidden">
      <p class="endTitle">つづく</p>
      <p id="endText"></p>
      <button id="againBtn" class="menuBtn small">タイトルへ</button>
    </div>

    <div id="toast"></div>

    <div id="autoBadge" class="hidden">AUTO（Esc・クリックで やめる）</div>
    <div id="cursor" class="hidden">
      <div id="cursorRing"></div>
      <svg viewBox="0 0 24 36" aria-hidden="true">
        <path d="M2 2 L2 28 L9 21.5 L13.5 32 L18 30 L13.5 19.5 L22.5 19.5 Z"
              fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ストーリーは 低ポリゴン版 専用（シナリオ最新版の 場面1）。いつも 最新を 読む -->
  <script>document.write('<script src="story.js?v=' + Date.now() + '"><\/script>');</script>

  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
  import * as THREE from 'three';

  // ============================================================
  // 画面・入力・会話（ほんものの ゲームと 同じ しくみ）
  // ============================================================
  const W = 1194, H = 834;
  const $ = id => document.getElementById(id);
  const screenEl = $('screen'), canvas = $('canvas');
  const ui = {
    fade: $('fade'), dialog: $('dialog'), speaker: $('speaker'), face: $('face'),
    text: $('text'), choices: $('choices'), nextMark: $('nextMark'),
    title: $('title'), ending: $('ending'), endText: $('endText'), toast: $('toast'),
  };
  const FACES = {
    hero: 'assets/face_hero.png', heroSleepy: 'assets/face_hero_sleepy.png',
    captive: 'assets/face_captive.png', monster: 'assets/face_monster.png',
  };

  window.flags = {};
  let mode = 'title';
  let timeScale = 1;
  let player, followCam, monsterState, monsterDX, captiveDX, captiveDY, policeState, policeDX, policeDY, eatStart, thrown, shown, done, eyelid;
  let area, policeSpin, moon, houseHero, houseKaitou, doorOpen, alarmResolve = null, running = false, wallBroken = 0, shake = 0;
  const keys = { left: false, right: false, up: false, down: false };

  function reset() {
    for (const k in flags) delete flags[k];
    resetPlayer();
    followCam = true;
    monsterState = 'full'; monsterDX = 0; captiveDX = 0; captiveDY = 0; eatStart = 0; thrown = null;
    policeState = 'none'; policeDX = 0; policeDY = 0;
    area = 'corridor'; policeSpin = 0; moon = 0; doorOpen = 0; running = false; shake = 0;
    if (typeof repairWall === 'function') repairWall();
    houseHero = { x: -.7, z: 3.4, t: 0, moving: false }; houseKaitou = { x: .7, z: 3.2, t: 0, moving: false, visible: true };
    alarmResolve = null; $('alarmGuide').classList.add('hidden');
    shown = {}; done = {}; eyelid = 0;
    ui.fade.style.transition = 'none'; ui.fade.style.opacity = 0;
    ui.dialog.classList.add('hidden');
  }
  function resetPlayer() {
    player = { x: STORY.playerStart.x, y: STORY.playerStart.y, moving: false, t: 0, face: 0 };
  }

  function tween(ms, fn) {
    ms /= timeScale;
    return new Promise(resolve => {
      if (ms <= 0) { fn(1); resolve(); return; }
      const t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / ms);
        fn(p);
        if (p < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }
  const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  const wait = ms => new Promise(r => setTimeout(r, ms / timeScale));

  let advanceResolve = null, typeTimer = null, typing = false, fullText = '', chooseResolve = null;
  const say = (speaker, text, opt = {}) => new Promise(resolve => {
    openDialog(speaker, opt);
    ui.dialog.classList.remove('choosing');
    if (opt.face && FACES[opt.face]) { ui.face.src = FACES[opt.face]; ui.face.classList.remove('hidden'); }
    else ui.face.classList.add('hidden');
    typeText(text);
    advanceResolve = () => { advanceResolve = null; ui.dialog.classList.add('hidden'); resolve(); };
  });
  const choose = (options, opt = {}) => new Promise(resolve => {
    openDialog(opt.speaker || '', opt);
    ui.dialog.classList.add('choosing');
    ui.choices.innerHTML = '';
    ui.choices.classList.toggle('three', options.length >= 3);
    options.forEach(label => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = label;
      b.addEventListener('click', ev => {
        ev.stopPropagation(); chooseResolve = null; ui.choices.innerHTML = '';
        ui.dialog.classList.add('hidden'); resolve(label);
      });
      ui.choices.appendChild(b);
    });
    chooseResolve = i => { const b = ui.choices.children[i]; if (b) b.click(); };
  });
  function openDialog(speaker, opt) {
    ui.speaker.textContent = speaker;
    ui.speaker.classList.toggle('hidden', !speaker);
    ui.dialog.classList.toggle('bottom', opt.box === 'bottom');
    ui.dialog.classList.remove('hidden');
  }
  function typeText(text) {
    clearInterval(typeTimer);
    const chars = Array.from(text); let n = 0;
    fullText = text; typing = true; ui.text.textContent = ''; ui.nextMark.classList.add('hidden');
    typeTimer = setInterval(() => { n++; ui.text.textContent = chars.slice(0, n).join(''); if (n >= chars.length) finishTyping(); }, 40 / timeScale);
  }
  function finishTyping() { clearInterval(typeTimer); typing = false; ui.text.textContent = fullText; ui.nextMark.classList.remove('hidden'); }
  function advance() {
    if (ui.dialog.classList.contains('hidden') || ui.dialog.classList.contains('choosing')) return;
    if (typing) { finishTyping(); return; }
    if (advanceResolve) advanceResolve();
  }

  const fadeOut = (color = 'black', ms = 600) => {
    ui.fade.style.background = color === 'white' ? '#ffffff' : '#151f10';
    ui.fade.style.transition = `opacity ${ms / timeScale}ms`;
    void ui.fade.offsetWidth;
    ui.fade.style.opacity = 1;
    return wait(ms);
  };
  const fadeIn = (ms = 600) => { ui.fade.style.transition = `opacity ${ms / timeScale}ms`; ui.fade.style.opacity = 0; return wait(ms); };
  const blink = async () => {
    eyelid = 1; ui.fade.style.transition = 'none'; ui.fade.style.opacity = 0;
    await tween(900, p => { eyelid = 1 - ease(p) * 0.55; });
    await tween(250, p => { eyelid = 0.45 + p * 0.55; });
    await wait(200);
    await tween(700, p => { eyelid = 1 - ease(p) * 0.8; });
    await tween(200, p => { eyelid = 0.2 + p * 0.8; });
    await tween(600, p => { eyelid = 1 - ease(p); });
    eyelid = 0;
  };
  const show = name => { shown[name] = true; };
  const hide = name => { delete shown[name]; };
  const monster = state => { monsterState = state; monsterDX = 0; captiveDX = 0; captiveDY = 0; if (state === 'eat') eatStart = performance.now(); };
  const police = state => { if (policeState === 'none') { policeDX = 0; policeDY = 0; } policeState = state; };
  const policeWalk = (dx, dy, ms) => { const fx = policeDX, fy = policeDY; return tween(ms, p => { policeDX = fx + dx * p; policeDY = fy + dy * p; }); };
  const monsterWalk = (dx, ms) => { const from = monsterDX; return tween(ms, p => { monsterDX = from + dx * p; }); };
  const captiveWalk = (dx, dy, ms) => { const fx = captiveDX, fy = captiveDY; return tween(ms, p => { captiveDX = fx + dx * p; captiveDY = fy + dy * p; }); };
  const throwItem = async (ms = 600) => {
    const x0 = player.x + 20, y0 = player.y - 10, x1 = 760, y1 = 640;
    await tween(ms, p => { thrown = { x: x0 + (x1 - x0) * p, y: y0 + (y1 - y0) * p, h: 1.1 + Math.sin(p * Math.PI) * 1.6, spin: p * 12 }; });
    thrown = null;
  };
  // カメラ：y は ほんものの ゲームと 同じ「画面の いちばん上の マップの 位置」
  let camTarget = null;
  const camera = (y, ms = 800) => {
    followCam = false;
    const from = camTarget ? camTarget : focusZ(player.y);
    const to = (y + 600) / 100;
    return tween(ms, p => { camTarget = from + (to - from) * ease(p); });
  };
  const follow = () => { followCam = true; camTarget = null; };
  const walkTo = (y, ms = 800) => {
    const from = player.y; player.moving = true; player.face = 0;
    return tween(ms, p => { player.y = from + (y - from) * p; player.t += 0.016; }).then(() => { player.moving = false; });
  };
  let toastTimer = null;
  const note = text => {
    ui.toast.textContent = text; ui.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 3500);
  };
  const end = text => { mode = 'end'; ui.endText.textContent = text; ui.ending.classList.remove('hidden'); };

  const walked = () => Math.hypot(player.x - STORY.playerStart.x, player.y - STORY.playerStart.y);
  // 時計に「タップして とめる」を 出して、とめるまで 待つ
  const stopAlarm = () => new Promise(resolve => {
    $('alarmGuide').classList.remove('hidden');
    alarmResolve = () => { alarmResolve = null; $('alarmGuide').classList.add('hidden'); resolve(); };
  });
  $('alarmGuide').addEventListener('click', e => { e.stopPropagation(); if (alarmResolve) alarmResolve(); });
  // 警察が 体を 一周 まわすと、怪盗（黄色い人）に 変わる
  const policeTurn = async () => {
    await tween(1600, p => { policeSpin = ease(p) * Math.PI * 2; if (p > .5 && policeState === 'police') policeState = 'kaitou'; });
    policeSpin = 0; policeState = 'kaitou';
  };
  // 怪盗が 主人公の 手を取って 上へ 走る
  // 二人とも 走る（上下に はずむ）
  const runWithKaitou = async () => {
    running = true;
    await Promise.all([policeWalk(0, -700, 2300), walkTo(player.y - 700, 2300)]);
    running = false;
  };
  const arriveHouse = async () => {
    running = true;
    houseHero.x = -1.6; houseHero.z = 22.6; houseKaitou.x = 3.6; houseKaitou.z = 22.6;  // カメラの 横を 走りぬけて くる
    await Promise.all([walkHouse(houseHero, -.6, 14.6, 2400), walkHouse(houseKaitou, 2.7, 12.2, 2400)]);
    running = false;
  };
  const place = name => {
    area = name;
    if (name === 'house') {
      houseHero = { x: -.6, z: 14.6, t: 0, moving: false };
      houseKaitou = { x: 2.7, z: 12.2, t: 0, moving: false, visible: true, goIn: false };
      doorOpen = 0; moon = 0;
    }
  };
  const moonlight = () => tween(1500, p => { moon = p; });
  const walkHouse = (who, x, z, ms) => {
    const fx = who.x, fz = who.z; who.moving = true;
    return tween(ms, p => { who.x = fx + (x - fx) * p; who.z = fz + (z - fz) * p; who.t += .016; }).then(() => { who.moving = false; });
  };
  const enterHouse = async step => {
    if (step === 'open') {
      houseKaitou.goIn = true;
      await walkHouse(houseKaitou, .5, 2.0, 4200);                          // ドアの 前へ（遠くの 建物まで 歩く）
      await tween(1200, p => { doorOpen = ease(p); });                      // ゆっくり 開ける
      houseKaitou.goIn = false;                                             // ふりかえって「さぁ入って。」
    } else {
      houseKaitou.goIn = true;
      await walkHouse(houseKaitou, .5, -1.2, 1100);                         // 先に 入る（頭も ドアを 通る）
      houseKaitou.visible = false;
      await walkHouse(houseHero, -.2, 2.0, 4200);                           // 後を 追って
      await walkHouse(houseHero, -.2, -1.0, 1000);
    }
  };

  // 左の かべを こわす（バケモノが 去る 時）／ 時が もどったら もとどおり
  function breakWall() {
    wallBroken = 1; shake = .5;
    breakableWall.visible = false; rubbleG.visible = true;
    rubbleG.children.forEach(r => { r.userData.t = 0; r.position.copy(r.userData.from); });
  }
  function repairWall() { wallBroken = 0; breakableWall.visible = true; rubbleG.visible = false; }

  Object.assign(window, { walked, stopAlarm, policeTurn, runWithKaitou, arriveHouse, place, moonlight, enterHouse, breakWall, repairWall });
  Object.assign(window, { wait, say, choose, fadeOut, fadeIn, blink, show, hide, monster, monsterWalk, captiveWalk,
    police, policeWalk, throwItem, camera, follow, walkTo, resetPlayer, note, end });

  async function runEvent(fn) {
    mode = 'event'; player.moving = false;
    try { await fn(); } catch (e) { console.error(e); }
    if (mode === 'event') mode = 'play';
  }
  async function startGame() { reset(); ui.title.classList.add('hidden'); await runEvent(STORY.opening); }
  function backToTitle() { reset(); mode = 'title'; ui.ending.classList.add('hidden'); ui.title.classList.remove('hidden'); }
  function checkTriggers() {
    for (const t of STORY.triggers) {
      const key = t.id + ':' + (flags.loop || 0);
      if (done[key] || (t.if && !t.if())) continue;
      if (t.when ? t.when() : player.y <= t.y) { done[key] = true; runEvent(t.run); return; }
    }
  }

  const KEYMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down' };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.key];
    if (k) { keys[k] = true; e.preventDefault(); }
    if (!e.repeat && (e.key === 'Enter' || e.key === ' ')) { if (alarmResolve) alarmResolve(); else advance(); e.preventDefault(); }
    if (chooseResolve && /^[1-9]$/.test(e.key)) chooseResolve(Number(e.key) - 1);
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch = null; });
  let touch = null;
  canvas.addEventListener('pointerdown', e => {
    if (touch) return;
    touch = { id: e.pointerId, x0: e.clientX, y0: e.clientY, vx: 0, vy: 0, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (!touch || e.pointerId !== touch.id) return;
    const dx = e.clientX - touch.x0, dy = e.clientY - touch.y0, d = Math.hypot(dx, dy);
    if (d < 12) { touch.vx = 0; touch.vy = 0; return; }
    touch.moved = true; touch.vx = dx / d; touch.vy = dy / d;
  });
  function touchEnd(e) {
    if (!touch || e.pointerId !== touch.id) return;
    const tapped = !touch.moved && e.type === 'pointerup';
    touch = null; if (tapped) advance();
  }
  canvas.addEventListener('pointerup', touchEnd);
  canvas.addEventListener('pointercancel', touchEnd);
  ui.dialog.addEventListener('click', advance);
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', backToTitle);

  const settings = { bgm: 1, se: 1 };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('starto.settings') || '{}')); } catch (e) {}
  function showSettings() { document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', settings[d.dataset.key] === Number(d.dataset.level))); }
  document.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => {
    settings[d.dataset.key] = Number(d.dataset.level);
    try { localStorage.setItem('starto.settings', JSON.stringify(settings)); } catch (e) {}
    showSettings();
  }));
  $('settingBtn').addEventListener('click', () => { showSettings(); $('settings').classList.remove('hidden'); });
  $('backBtn').addEventListener('click', () => $('settings').classList.add('hidden'));

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    screenEl.style.width = W * s + 'px'; screenEl.style.height = H * s + 'px';
    screenEl.style.fontSize = (W * s / 119.4) + 'px';
  }
  addEventListener('resize', fit); fit();

  // ============================================================
  // 低ポリゴンの 世界（マップの 座標は ゲームと 同じ。100px = 1）
  // ============================================================
  const MAP = { left: STORY.map.floorLeft, right: STORY.map.floorRight, bottom: STORY.map.floorBottom, top: 30, walls: STORY.map.walls };
  const X = px => (px - 600) / 100, Z = py => py / 100;
  const focusZ = py => Z(py) - 2.6;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H, false);
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#151f10');
  scene.fog = new THREE.Fog('#151f10', 14, 30);
  const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  const hemi = new THREE.HemisphereLight('#fffbe8', '#4a5a38', 1.6);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight('#fff4d6', 2.2);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
  scene.add(sun, sun.target);

  const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, ...extra });
  const shadowAll = o => o.traverse(m => { if (m.isMesh) m.castShadow = true; });

  function lowPolyPlane(w, d, segW, segD, base) {
    let g = new THREE.PlaneGeometry(w, d, segW, segD);
    g.rotateX(-Math.PI / 2);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const edge = Math.abs(Math.abs(pos.getX(i)) - w / 2) < 1e-4 || Math.abs(Math.abs(pos.getZ(i)) - d / 2) < 1e-4;
      if (!edge) {
        pos.setX(i, pos.getX(i) + (Math.random() - .5) * (w / segW) * .5);
        pos.setZ(i, pos.getZ(i) + (Math.random() - .5) * (d / segD) * .5);
      }
      pos.setY(i, (Math.random() - .5) * .06);
    }
    g = g.toNonIndexed();
    const c = new THREE.Color(base), colors = [];
    for (let i = 0; i < g.attributes.position.count; i += 3) {
      const k = 1 + (Math.random() - .5) * .09;
      for (let j = 0; j < 3; j++) colors.push(c.r * k, c.g * k, c.b * k);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    g.computeVertexNormals();
    return g;
  }
  const floor = new THREE.Mesh(lowPolyPlane((MAP.right - MAP.left) / 100, (MAP.bottom - MAP.top) / 100, 9, 40, '#eaf2d7'),
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  floor.position.set(X((MAP.left + MAP.right) / 2), 0, Z((MAP.top + MAP.bottom) / 2));
  floor.receiveShadow = true;
  scene.add(floor);

  function rockBox(w, h, d, color) {

    for (let i = 0; i < p.count; i++) if (p.getY(i) > -h / 2 + 1e-4) {

      p.setY(i, p.getY(i) + (Math.random() - .5) * .12);
      p.setZ(i, p.getZ(i) + (Math.random() - .5) * .08);

    m.castShadow = m.receiveShadow = true;
    return m;
  }

  const smokeG = new THREE.Group(); houseG.add(smokeG);
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(.45, 0), new THREE.MeshBasicMaterial({ color: '#e9ecef', transparent: true, opacity: .7, depthWrite: false }));
    m.userData.phase = i / 9; smokeG.add(m);
  }
  // 星空 と 月
  { const pos = [];
    for (let i = 0; i < 700; i++) { const a = Math.random() * Math.PI * 2, e = .1 + Math.random() * 1.3, r = 70;
      pos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r - 10); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    houseG.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#ffffff', size: .35, fog: false }))); }
  const moonM = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 1), new THREE.MeshBasicMaterial({ color: '#fff4cc', fog: false }));
  moonM.position.set(-26, 30, -45); houseG.add(moonM);
  const moonSpot = new THREE.SpotLight('#fff3c4', 0, 40, .25, .6, 0); scene.add(moonSpot, moonSpot.target);
  const houseLamp = new THREE.PointLight('#fff6e6', 0, 14, 0); houseLamp.position.set(60, 2.2, 3); scene.add(houseLamp);

  // ============================================================
  // 更新と 描画
  // ============================================================
  const HALF_W = 34;
  function blocked(x, y) {
    if (x - HALF_W < MAP.left || x + HALF_W > MAP.right) return true;
    if (y > MAP.bottom || y < MAP.top + 20) return true;
    return MAP.walls.some(w => x + HALF_W > w.x1 && x - HALF_W < w.x2 && y > w.y1 && y - 20 < w.y2);
  }
  function update(dt) {
    if (mode === 'play') {
      let vx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), vy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (vx && vy) { vx *= Math.SQRT1_2; vy *= Math.SQRT1_2; }
      if (!vx && !vy && touch) { vx = touch.vx; vy = touch.vy; }
      if (!vx && !vy && autoMove) { vx = autoMove.vx; vy = autoMove.vy; }
      const sp = (flags.run ? STORY.runSpeed || STORY.walkSpeed : STORY.walkSpeed) * dt * timeScale, nx = player.x + vx * sp, ny = player.y + vy * sp;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      player.moving = vx !== 0 || vy !== 0;
      if (player.moving) { player.t += dt * timeScale; player.face = Math.atan2(vx, -vy); }
      checkTriggers();
    } else if (mode === 'event') {
      player.face += (0 - player.face) * Math.min(1, dt * 8);     // できごとの 間は 上（奥）を むく
    }
  }

  const camL = new THREE.Vector3(), camP = new THREE.Vector3(), wantL = new THREE.Vector3();
  let first = true;
  function draw(now, dt) {
    const t = now / 1000;
    // 主人公
    const runK = running ? 16 : 11, runH = running ? .22 : (flags.run ? .12 : .06);     // 走る 時は 大きく はずむ
    const heroPhase = running ? t * runK : player.t * runK;
    heroM.position.set(X(player.x), player.moving ? Math.abs(Math.sin(heroPhase)) * runH : 0, Z(player.y));
    heroM.rotation.y = -player.face;
    heroM.userData.legs.forEach((l, i) => { l.rotation.x = player.moving ? Math.sin(heroPhase + i * Math.PI) * (running ? .8 : .5) : 0; });
    heroM.userData.arms.forEach((a, i) => { a.rotation.x = player.moving ? -Math.sin(heroPhase + i * Math.PI) * (running ? .9 : .4) : 0; });
    if (thrown) heroM.userData.arms[1].rotation.x = -2.4;

    // バケモノ と 人物A
    const MON = { full: 600, eat: 600, alone: 600, apart: 760, down: 760 };
    const walking = monsterDX !== 0;
    monsterM.visible = monsterState in MON;
    if (monsterM.visible) {
      const body = monsterM.userData.body;
      monsterM.position.set(X(MON[monsterState] + monsterDX), walking ? Math.abs(Math.sin(monsterDX / 40)) * .12 : 0, Z(625));
      monsterM.rotation.y = walking && monsterDX > 0 ? Math.PI : 0;      // くちばしは すすむ ほうへ
      if (monsterState === 'down') { body.rotation.z = -1.35; body.position.set(-1.35, 1.25, 0); }  // あおむけに ひっくり かえる（かべに めりこまない 位置）
      else { body.rotation.z = 0; body.position.set(0, 0, 0); }
      if (monsterState === 'eat') { body.rotation.x = Math.sin(t * 18) * .06; body.scale.set(1, 1 + Math.max(0, Math.sin((now - eatStart) / 850 * Math.PI)) * .12, 1); }
      else { body.rotation.x = 0; body.scale.set(1, 1, 1); }
    }
    captiveM.visible = ['full', 'eat', 'apart', 'down', 'captive'].includes(monsterState);
    if (captiveM.visible) {
      // つかまっている 時は くちばしの 先、2周目は バケモノの 左に 立つ
      let s = 1, lift = 0, x = (monsterState === 'full' || monsterState === 'eat' ? 455 : 470) + captiveDX, z = Z(621);
      if (monsterState === 'full') { lift = .55 + Math.sin(t * 9) * .05; captiveM.rotation.z = -.45; z += .1; }
      else if (monsterState === 'eat') {
        // 口から 体の 中へ すいこまれて、だんだん 見えなくなる
        const p = Math.min(1, (now - eatStart) / 850), e = p * p;
        x = 455 + e * 145; lift = .55 + Math.sin(p * Math.PI) * .6 - e * .55; s = 1 - e * .65;
        captiveM.rotation.z = -.45 - e * 1.1; z += .1;
        if (p >= 1) captiveM.visible = false;
      } else captiveM.rotation.z = Math.sin(t * 2) * .05;
      captiveM.scale.setScalar(Math.max(.001, s));
      const cm = captiveDX || captiveDY;
      captiveM.position.set(X(x), lift + (cm ? Math.abs(Math.sin((captiveDX + captiveDY) / 30)) * .08 : 0), z + captiveDY / 100);
      captiveM.rotation.y = cm ? Math.atan2(captiveDX, captiveDY) : 0;
    }
    policeM.visible = policeState === 'police';
    kaitouM.visible = policeState === 'kaitou';
    for (const m of [policeM, kaitouM]) {
      const walkingP = policeDY > 0 && policeDY < 700;
      const bobP = running ? Math.abs(Math.sin(t * 16 + 1.3)) * .24 : walkingP ? Math.abs(Math.sin(policeDY / 30)) * .08 : 0;
      m.position.set(X(606 + policeDX), bobP, Z(-26 + policeDY));
      m.rotation.y = policeSpin + (running ? Math.PI : 0);
    }
    // 拳銃を かまえる 時は 右うでを 前に のばす
    const aiming = !!shown.gun || !!shown.flowers;
    policeM.userData.gunArm.visible = aiming; policeM.userData.akimboR.visible = !aiming;
    gunM.visible = aiming;
    flowersM.visible = !!shown.flowers;
    if (shown.flowers) {
      gunM.getWorldPosition(tmpV);
      flowersM.position.set(tmpV.x, tmpV.y + .05 + Math.abs(Math.sin(t * 3)) * .03, tmpV.z + .45);
    }

    // 怪盗の家の前
    if (area === 'house') {
      const hk = running ? 16 : 11, hh = running ? .22 : .06;
      heroM.position.set(HOUSE.x + houseHero.x, houseHero.moving ? Math.abs(Math.sin(t * hk)) * hh : 0, HOUSE.z + houseHero.z);
      heroM.rotation.y = 0;
      heroM.userData.legs.forEach((l, i) => { l.rotation.x = houseHero.moving ? Math.sin(t * hk + i * Math.PI) * (running ? .8 : .5) : 0; });
      heroM.userData.arms.forEach((a, i) => { a.rotation.x = houseHero.moving ? -Math.sin(t * hk + i * Math.PI) * (running ? .9 : .4) : 0; });
      kaitouM.visible = houseKaitou.visible; policeM.visible = false;
      kaitouM.position.set(HOUSE.x + houseKaitou.x, houseKaitou.moving ? Math.abs(Math.sin(t * hk + 1.3)) * (running ? .24 : .08) : 0, HOUSE.z + houseKaitou.z);
      kaitouM.rotation.y = running || houseKaitou.goIn ? Math.PI : 0;
      monsterM.visible = captiveM.visible = false;
      arrowG.visible = false;
    }
    doorL.rotation.y = -doorOpen * 1.5; doorR.rotation.y = doorOpen * 1.5;
    glowMat.opacity = .15 + doorOpen * .55 + Math.sin(t * 2) * .04;
    if (area === 'house') smokeG.children.forEach(m => {
      const k = (t * .12 + m.userData.phase) % 1;
      m.position.set(-3.0 + Math.sin(k * 7 + m.userData.phase * 9) * (.3 + k * 1.4), 9.6 + k * 7, -3.6 + Math.cos(k * 7) * .5);
      m.scale.setScalar(.6 + k * 2.2);
      m.material.opacity = .7 * (1 - k);
    });

    // 案内の 矢印：自由に 歩ける 時だけ、まんなかの 入口の ほうへ
    const freeMove = mode === 'play' && area === 'corridor' && ui.dialog.classList.contains('hidden');
    arrowG.visible = freeMove;
    if (freeMove) {
      const dx = X(606) - X(player.x) * 1, dz = -4;
      const len = Math.hypot(dx, dz), ux = dx / len, uz = dz / len;
      arrowG.position.set(X(player.x) + ux * 1.7, .06, Z(player.y) + uz * 1.7);
      arrowG.rotation.y = Math.atan2(-ux, -uz);
      arrowMat.forEach((m, i) => { m.opacity = .25 + .75 * Math.max(0, Math.sin(t * 5 - i * .9)); });
    }
    // こわれた かべの がれき
    if (rubbleG.visible) rubbleG.children.forEach(r => {
      if (r.userData.t > 1.2) return;
      r.userData.t += dt;
      const k = r.userData.t;
      r.position.set(r.userData.from.x + r.userData.v.x * k, Math.max(.06, r.userData.from.y + r.userData.v.y * k - 4.9 * k * k), r.userData.from.z + r.userData.v.z * k);
      r.rotation.x += dt * 6; r.rotation.y += dt * 4;
    });
    shake = Math.max(0, shake - dt);

    // 時計・！マーク・投げた 荷物
    const ring = shown.ring && (t % 1) < .45;
    watchM.visible = !!shown.watch;
    watchM.position.set(heroM.position.x + .6, 2.05 + (ring ? Math.abs(Math.sin(t * 28)) * .14 : 0), heroM.position.z);
    watchM.rotation.set(0, -.3, ring ? Math.sin(t * 28) * .22 : 0);
    exclaimM.visible = !!shown.exclaim;
    exclaimM.position.set(heroM.position.x + .45, 2.0 + Math.abs(Math.sin(t * 6)) * .05, heroM.position.z);
    exclaimM.quaternion.copy(cam.quaternion);
    thrownM.visible = !!thrown;
    if (thrown) { thrownM.position.set(X(thrown.x), thrown.h, Z(thrown.y)); thrownM.rotation.set(thrown.spin, thrown.spin * .7, 0); }

    shards.children.forEach((s, i) => { s.rotation.x += dt * (.3 + i % 5 * .1); });

    if (area === 'house') {
      // 夜：星空の 下の 家を 前から 見る
      cam.position.set(HOUSE.x + 1.6, 2.3, HOUSE.z + 20.4);   // 主人公の ななめ うしろ から、遠くの 大きな 建物を 見る
      camL.set(HOUSE.x - .1, 2.4, HOUSE.z - 2);
      cam.lookAt(camL);
      scene.background.set('#0b1020'); scene.fog.color.set('#0b1020'); scene.fog.near = 30; scene.fog.far = 90;
      hemi.color.set('#9fb3ff'); hemi.groundColor.set('#1a2416'); hemi.intensity = .45;
      sun.color.set('#c9d6ff'); sun.intensity = .9;
      sun.position.set(HOUSE.x - 6, 12, HOUSE.z + 20); sun.target.position.set(HOUSE.x, 0, HOUSE.z + 13);
      moonSpot.position.set(HOUSE.x - 6, 14, HOUSE.z + 22); moonSpot.target.position.copy(kaitouM.position);
      moonSpot.intensity = moon * 6;
      houseLamp.intensity = .8 + doorOpen * 1.6;
    } else {
      // カメラ（ななめ上から 主人公を おいかける）
      const lz = followCam || camTarget === null ? focusZ(player.y) : camTarget;
      wantL.set(X(player.x) * .3, .6, Math.max(lz, 1.5));
      if (first) { camL.copy(wantL); first = false; }
      camL.lerp(wantL, 1 - Math.pow(.0005, dt));
      camP.set(camL.x * 1.3, 7.2, camL.z + 6.8);
      cam.position.copy(camP);
      if (shake > 0) cam.position.x += Math.sin(t * 60) * shake * .25;
      cam.lookAt(camL);
      scene.background.set('#151f10'); scene.fog.color.set('#151f10'); scene.fog.near = 14; scene.fog.far = 30;
      hemi.color.set('#fffbe8'); hemi.groundColor.set('#4a5a38'); hemi.intensity = 1.6;
      sun.color.set('#fff4d6'); sun.intensity = 2.2;
      sun.position.set(camL.x - 4, 10, camL.z + 8); sun.target.position.copy(camL);
      moonSpot.intensity = 0; houseLamp.intensity = 0;
    }

    // アラームを 止める ガイドを 時計の 上に
    if (alarmResolve) {
      tmpV.copy(watchM.position).project(cam);
      $('alarmGuide').style.left = ((tmpV.x + 1) / 2 * 100) + '%';
      $('alarmGuide').style.top = ((1 - tmpV.y) / 2 * 100) + '%';
    }

    // まぶた
    const lid = (eyelid * 50) + '%';
    $('lidTop').style.height = lid; $('lidBot').style.height = lid;

    renderer.render(scene, cam);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now, dt);
    requestAnimationFrame(loop);
  }
  // ============================================================
  // オートモード（ほんものの ゲームと 同じ うごき）
  // ============================================================
  const cursorEl = $('cursor'), ringEl = $('cursorRing'), badgeEl = $('autoBadge');
  const AUTO_DOOR_X = 606;
  let auto = false, autoMove = null, autoChoiceIdx = 0;
  const cur = { x: W / 2, y: H / 2 };
  function placeCursor() { cursorEl.style.left = (cur.x / W * 100) + '%'; cursorEl.style.top = (cur.y / H * 100) + '%'; }
  function cursorTo(x, y) {
    const fx = cur.x, fy = cur.y, ms = Math.min(900, 250 + Math.hypot(x - fx, y - fy) * 0.9);
    return tween(ms, p => { const e = ease(p); cur.x = fx + (x - fx) * e; cur.y = fy + (y - fy) * e; placeCursor(); });
  }
  function centerOf(el) {
    const s = screenEl.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: (r.left + r.width / 2 - s.left) / s.width * W, y: (r.top + r.height / 2 - s.top) / s.height * H };
  }
  async function clickFx() {
    cursorEl.classList.add('pressed'); await wait(110); cursorEl.classList.remove('pressed');
    ringEl.classList.remove('pop'); void ringEl.offsetWidth; ringEl.classList.add('pop'); await wait(120);
  }
  async function autoClick(btn) {
    const c = centerOf(btn);
    await cursorTo(c.x, c.y);
    if (!auto) return false;
    btn.classList.add('hover'); await wait(350); await clickFx(); btn.classList.remove('hover');
    if (!auto || !btn.isConnected) return false;
    btn.click();
    return true;
  }
  async function startAuto() {
    if (auto) return;
    auto = true; timeScale = STORY.autoSpeed || 1; autoChoiceIdx = 0;
    screenEl.classList.add('auto'); badgeEl.classList.remove('hidden'); cursorEl.classList.remove('hidden');
    const c = centerOf($('autoBtn')); cur.x = c.x; cur.y = c.y; placeCursor();
    await wait(400);
    if (await autoClick($('startBtn'))) autopilot();
  }
  function stopAuto() {
    auto = false; timeScale = 1; autoMove = null;
    screenEl.classList.remove('auto'); badgeEl.classList.add('hidden');
    cursorEl.classList.add('hidden'); cursorEl.classList.remove('pressed');
  }
  async function autopilot() {
    while (auto) {
      if (alarmResolve) {
        await wait(700);
        if (auto && alarmResolve) await autoClick($('alarmGuide'));
        continue;
      }
      const d = ui.dialog, open = !d.classList.contains('hidden');
      if (open && d.classList.contains('choosing')) {
        await wait(800);
        if (!auto) break;
        const btns = [...ui.choices.children];
        if (!btns.length) continue;
        const want = (STORY.autoChoices || [])[autoChoiceIdx];
        const b = btns.find(b => want !== undefined && b.textContent.replace(/\n/g, '') === want.replace(/\n/g, ''));
        if (b) autoChoiceIdx++;
        await autoClick(b || btns[0]);
      } else if (open) {
        while (auto && typing) await wait(50);
        await wait(900 + Math.min(1200, fullText.length * 25));
        if (!auto || d.classList.contains('hidden') || d.classList.contains('choosing')) continue;
        const c = centerOf(ui.nextMark);
        await cursorTo(c.x, c.y);
        if (!auto) break;
        await clickFx();
        if (!auto) break;
        advance();
        await wait(150);
      } else if (mode === 'play') {
        await autoWalk();
      } else if (mode === 'end') {
        await wait(2500);
        if (!auto) break;
        if (await autoClick($('againBtn'))) stopAuto();
      } else {
        await wait(100);
      }
    }
  }
  // 画面の 上での 主人公の 位置（3D → 画面の px）
  const tmpV = new THREE.Vector3();
  function heroOnScreen() {
    tmpV.set(heroM.position.x, 1.1, heroM.position.z).project(cam);
    return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
  }
  async function autoWalk() {
    const anchor = () => { const h = heroOnScreen(); return { x: h.x + 170, y: h.y }; };
    let a = anchor();
    await cursorTo(a.x, a.y);
    if (!auto || mode !== 'play') return;
    cursorEl.classList.add('pressed');
    await wait(200);
    const t0 = performance.now();
    while (auto && mode === 'play') {
      let vx = Math.max(-1, Math.min(1, (AUTO_DOOR_X - player.x) / 80)) * 0.6, vy = -1;
      const n = Math.hypot(vx, vy); vx /= n; vy /= n;
      autoMove = { vx, vy };
      a = anchor();
      const k = Math.min(1, (performance.now() - t0) / 250);
      cur.x = a.x + vx * 90 * k; cur.y = a.y + vy * 90 * k;
      placeCursor();
      await wait(16);
    }
    autoMove = null;
    cursorEl.classList.remove('pressed');
  }
  $('autoBtn').addEventListener('click', startAuto);
  addEventListener('keydown', e => { if (auto && e.isTrusted) stopAuto(); }, true);
  addEventListener('pointerdown', e => { if (auto && e.isTrusted) stopAuto(); }, true);

  reset();
  requestAnimationFrame(loop);
  window.__lp = { get mode() { return mode; }, get player() { return player; }, advance, get flags() { return flags; }, monster, camera, show };
  </script>
