<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>スターと 低ポリゴン版（ためし）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <!-- 会話ウィンドウ・タイトル・セッティングの 見た目は 2D 版（START）と 同じ style.css -->
  <link rel="stylesheet" href="style.css">
  <style>
    .lid { position: absolute; left: 0; right: 0; height: 0; background: #151f10; pointer-events: none; }
    #lidTop { top: 0; } #lidBot { bottom: 0; }
    #screen.auto #lpBadge { display: none; }
    /* アラームを 止めるように さそう エフェクト */
    #alarmGuide { position: absolute; width: 11em; height: 11em; margin: -5.5em 0 0 -5.5em; border: none; padding: 0;
      background: transparent; cursor: pointer; z-index: 15; }
    #alarmGuide.hidden { display: none; }
    #alarmGuide::before, #alarmGuide::after { content: ''; position: absolute; inset: 2.5em; border-radius: 50%;
      border: .5em solid rgba(255, 214, 90, .95); animation: alarmPulse 1s ease-out infinite; }
    #alarmGuide::after { animation-delay: .5s; }
    #alarmGuide span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap;
      color: #fff; background: rgba(21, 31, 16, .85); padding: .3em .8em; border-radius: .5em; font-size: 1.6em; }
    @keyframes alarmPulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    /* ケーキを 切る ミニゲーム */
    #cakeGame { position: absolute; inset: 0; z-index: 14; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(30, 20, 12, .62); cursor: pointer; }
    #cakeGame.hidden { display: none; }
    #cakeGame canvas { width: 46em; height: 46em; }
    #cakeGame p { margin: .4em 0; color: #fff; font-size: 2em; text-shadow: 0 .1em .3em rgba(0,0,0,.6); }
    /* 会話ウィンドウは タイトル画面の 上にも 出す（ホーム画面の ナレーション） */
    #dialog { z-index: 5; }
    #dialog.narration { left: 0; top: 0; width: 100%; height: 100%; border: none; background: rgba(0, 0, 0, .82); }
    #dialog.narration #text { left: 12%; right: 12%; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; }
    #dialog.narration #nextMark { color: #fff; right: 6%; bottom: 7%; }
    #menu.hidden { visibility: hidden; }
    #menu { transition: opacity .6s; }
    /* 研究員の カット：右下の 小さな わくに 研究員、セリフは その 上の 吹き出し */
    #labVeil { position: absolute; inset: 0; z-index: 4; background: rgba(0, 0, 0, .5); }
    #labVeil.hidden, #labCut.hidden { display: none; }
    #labCut { position: absolute; right: 3.4%; bottom: 6.5%; width: 18.2%; z-index: 6; background: #fff; border: .35em solid #111; line-height: 0; }
    #labCut img { width: 100%; display: block; }
    /* アナログテレビが つく ように、わくの まんなかから 横に のびて、それから 縦に ひろがる */
    #labCut { animation: tvOn .7s ease-out both; transform-origin: 50% 50%; }
    @keyframes tvOn {
      0%   { transform: scale(.02, .01); filter: brightness(3); }
      35%  { transform: scale(1, .02); filter: brightness(3); }
      75%  { transform: scale(1, 1); filter: brightness(1.6); }
      100% { transform: scale(1, 1); filter: brightness(1); }
    }
    /* 消える ときは テレビを 消す ように：縦に つぶれて 横線 → 光の 点 → 消える */
    #labCut.off { animation: tvOff .55s ease-in both; }
    @keyframes tvOff {
      0%   { transform: scale(1, 1); filter: brightness(1); }
      45%  { transform: scale(1, .02); filter: brightness(3); }
      85%  { transform: scale(.02, .01); filter: brightness(3); }
      100% { transform: scale(0, 0); filter: brightness(3); }
    }
    #labCut .memo { position: absolute; left: 8%; bottom: 10%; width: 30%; height: 26%; background: #f4f0e2; border: .15em solid #333; transform: rotate(-6deg); display: none; }
    #labCut.memo .memo { display: block; }
    #labCut .memoBubble { display: none; position: absolute; right: 4%; bottom: 104%; padding: .5em 1em; background: #fff; border: .25em solid #000; border-radius: 1.2em;
      font-size: 1.6em; line-height: 1.3; white-space: nowrap; }
    #labCut .memoBubble::after { content: ''; position: absolute; right: 22%; bottom: -1em; border: .5em solid transparent; border-top: .6em solid #000; }
    #labCut.memo .memoBubble { display: block; }
    #labCut .memo::after { content: ''; position: absolute; left: 12%; top: 40%; height: .25em; background: #2a2a2a; animation: memoLine 1.2s steps(6) infinite; }
    @keyframes memoLine { from { width: 0; } to { width: 76%; } }
    #dialog.lab { left: auto; right: 3.4%; top: auto; bottom: 29%; width: 34%; height: auto; min-height: 9%; border-width: .3em; border-radius: 2.2em; padding: 1.2em 1.8em 1.4em; z-index: 7; }
    #dialog.lab #speaker, #dialog.lab #face { display: none; }
    #dialog.lab #text { position: static; font-size: 1.9em; line-height: 1.4; }
    #dialog.lab #nextMark { font-size: 1.4em; right: 4%; bottom: 8%; }
    #dialog.lab::after { content: ''; position: absolute; left: 62%; bottom: -1.6em; border: .9em solid transparent; border-top: 1em solid #000; }
    /* 書き込む 欄（プレイヤーが 文字を 入れる） */
    #writeBox { position: absolute; left: 6%; bottom: 7%; width: 54%; z-index: 9; background: #fff; border: .4em solid #000; border-radius: 1.2em;
      padding: 1.4em 1.8em; display: flex; flex-direction: column; gap: 1em; box-sizing: border-box; }
    #writeBox.hidden { display: none; }
    #writeBox label { font-size: 1.6em; color: #3d5a2a; }
    #writeBox .row { display: flex; gap: 1em; }
    #writeBox input { flex: 1; min-width: 0; font: inherit; font-size: 2.2em; padding: .25em .5em; border: .12em solid #999; border-radius: .4em; }
    #writeBox button { font: inherit; font-size: 2em; padding: .2em 1em; border: none; border-radius: .5em; background: #3d5a2a; color: #fff; cursor: pointer; }
    #lpBadge { position: absolute; left: 1.5%; bottom: 2.5%; color: #fff; background: rgba(21,31,16,.8);
      padding: .4em .9em; border-radius: .4em; font-size: 1.2em; pointer-events: none; }
  </style>
</head>
<body>
  <div id="screen">
    <canvas id="canvas"></canvas>
    <div id="lidTop" class="lid"></div>
    <div id="lidBot" class="lid"></div>
    <div id="fade"></div>

    <div id="dialog" class="hidden">
      <div id="speaker"></div>
      <img id="face" class="hidden" alt="">
      <div id="text"></div>
      <div id="choices"></div>
      <div id="nextMark">▶</div>
    </div>

    <div id="labVeil" class="hidden"></div>
    <form id="writeBox" class="hidden" autocomplete="off"><label id="writeLabel"></label><div class="row"><input id="writeInput" type="text" maxlength="40"><button type="submit">決定</button></div></form>
    <div id="labCut" class="hidden"><img src="assets/researcher.png" alt="研究員"><div class="memo"></div><div class="memoBubble">メモメモ...</div></div>

    <div id="lpBadge">低ポリゴン版（ためし）</div>
    <button id="alarmGuide" class="hidden" aria-label="アラームを とめる"><span>タップして とめる</span></button>

    <div id="title" class="overlay">
      <div id="menu">
        <button id="startBtn" class="menuBtn">始める</button>
        <button id="settingBtn" class="menuBtn">せってい</button>
        <button id="sceneBtn" class="menuBtn">場面をえらぶ</button>
        <button id="autoBtn" class="menuBtn">オートで みる</button>
      </div>
      <p class="howto">↑ ↓ ← → キー・ゆびで なぞる：あるく　／　クリック・タップ・Enter：すすむ・えらぶ</p>
    </div>

    <div id="settings" class="hidden">
      <div class="setRow" style="top: 30%">
        <span class="setLabel">BGM</span>
        <button class="dot" data-key="bgm" data-level="0" aria-label="BGM 小"></button>
        <button class="dot" data-key="bgm" data-level="1" aria-label="BGM 中"></button>
        <button class="dot" data-key="bgm" data-level="2" aria-label="BGM 大"></button>
      </div>
      <div class="setRow" style="top: 47.2%">
        <span class="setLabel">SE volume</span>
        <button class="dot" data-key="se" data-level="0" aria-label="SE 小"></button>
        <button class="dot" data-key="se" data-level="1" aria-label="SE 中"></button>
        <button class="dot" data-key="se" data-level="2" aria-label="SE 大"></button>
      </div>
      <button id="backBtn">back</button>
    </div>

    <!-- 場面をえらぶ：とちゅうの 場面から はじめる -->
    <div id="scenes" class="hidden">
      <p class="scenesTitle">場面をえらぶ</p>
      <button class="sceneBtn" data-scene="1" style="top: 30%">場面1　何もない部屋（はじめから）</button>
      <button class="sceneBtn" data-scene="2" style="top: 45%">場面2　かいとうの家に入るところから</button>
      <button id="scenesBackBtn">back</button>
    </div>

    <div id="ending" class="overlay hidden">
      <p class="endTitle">つづく</p>
      <p id="endText"></p>
      <button id="againBtn" class="menuBtn small">タイトルへ</button>
    </div>

    <div id="toast"></div>

    <div id="autoBadge" class="hidden">AUTO（Esc・クリックで やめる）</div>
    <div id="cursor" class="hidden">
      <div id="cursorRing"></div>
      <svg viewBox="0 0 24 36" aria-hidden="true">
        <path d="M2 2 L2 28 L9 21.5 L13.5 32 L18 30 L13.5 19.5 L22.5 19.5 Z"
              fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ストーリーは 低ポリゴン版 専用（シナリオ最新版の 場面1）。いつも 最新を 読む -->
  <script>document.write('<script src="story.js?v=' + Date.now() + '"><\/script>');</script>

  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
  import * as THREE from 'three';

  // ============================================================
  // 画面・入力・会話（ほんものの ゲームと 同じ しくみ）
  // ============================================================
  const W = 1194, H = 834;
  const $ = id => document.getElementById(id);
  const screenEl = $('screen'), canvas = $('canvas');
  const ui = {
    fade: $('fade'), dialog: $('dialog'), speaker: $('speaker'), face: $('face'),
    text: $('text'), choices: $('choices'), nextMark: $('nextMark'),
    title: $('title'), ending: $('ending'), endText: $('endText'), toast: $('toast'),
  };
  const FACES = {
    hero: 'assets/face_hero.png', heroSleepy: 'assets/face_hero_sleepy.png',
    captive: 'assets/face_captive.png', monster: 'assets/face_monster.png',
    police: 'assets/face_police.png', heroAlt: 'assets/face_hero_alt.png',     // けいさつ・家の中の 変身した 主人公
    kaitou1: 'assets/face_kaitou1.png', kaitou2: 'assets/face_kaitou2.png', kaitou3: 'assets/face_kaitou3.png',   // かいとうの 表情 1〜5
    kaitou4: 'assets/face_kaitou4.png', kaitou5: 'assets/face_kaitou5.png',
    kidA1: 'assets/face_kidA1.png', kidA2: 'assets/face_kidA2.png', kidA3: 'assets/face_kidA3.png', kidA4: 'assets/face_kidA4.png',   // 子どもA（ふつう・にこにこ・おどろき・しょんぼり）
    kidB1: 'assets/face_kidB1.png', kidB2: 'assets/face_kidB2.png', kidB3: 'assets/face_kidB3.png',   // 子どもB（にこっ・わらう・おどろき）
  };
  const SPEAKER_FACE = { 'バケモノ': 'monster', 'けいさつ': 'police' };   // 表情が 変わらない 人は 名前で きまる

  window.flags = {};
  let mode = 'title';
  let timeScale = 1;
  let player, followCam, monsterState, monsterDX, captiveDX, captiveDY, policeState, policeDX, policeDY, eatStart, thrown, shown, done, eyelid;
  let area, policeSpin, moon, houseHero, houseKaitou, doorOpen, alarmResolve = null, running = false, wallBroken = 0, shake = 0;
  const keys = { left: false, right: false, up: false, down: false };

  function reset() {
    for (const k in flags) delete flags[k];
    resetPlayer();
    followCam = true;
    monsterState = 'full'; monsterDX = 0; captiveDX = 0; captiveDY = 0; eatStart = 0; thrown = null;
    policeState = 'none'; policeDX = 0; policeDY = 0;
    area = 'corridor'; policeSpin = 0; moon = 0; doorOpen = 0; running = false; shake = 0;
    if (typeof repairWall === 'function') repairWall();
    houseHero = { x: -.7, z: 3.4, t: 0, moving: false }; houseKaitou = { x: .7, z: 3.2, t: 0, moving: false, visible: true };
    alarmResolve = null; $('alarmGuide').classList.add('hidden');
    shown = {}; done = {}; eyelid = 0;
    if (typeof reset2 === 'function') reset2();
    ui.fade.style.transition = 'none'; ui.fade.style.opacity = 0;
    ui.dialog.classList.add('hidden');
    $('writeBox').classList.add('hidden'); writing = null; roamNoArrow = false; if ($('peekCopy')) $('peekCopy').remove();
    $('labCut').classList.add('hidden'); $('labCut').classList.remove('off'); $('labVeil').classList.add('hidden'); peeking = false;
  }
  function resetPlayer() {
    player = { x: STORY.playerStart.x, y: STORY.playerStart.y, moving: false, t: 0, face: 0 };
  }

  function tween(ms, fn) {
    ms /= timeScale;
    return new Promise(resolve => {
      if (ms <= 0) { fn(1); resolve(); return; }
      const t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / ms);
        fn(p);
        if (p < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }
  const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  const wait = ms => new Promise(r => setTimeout(r, ms / timeScale));

  let advanceResolve = null, typeTimer = null, typing = false, fullText = '', chooseResolve = null;
  let talker = null;                                                   // いま 話している 人（体を ゆっくり ゆらす）
  const say = (speaker, text, opt = {}) => new Promise(resolve => {
    openDialog(speaker, opt);
    talker = speaker;
    ui.dialog.classList.remove('choosing');
    let face = opt.face || SPEAKER_FACE[speaker];
    if (face === 'hero' && outfit) face = 'heroAlt';   // 家の中では 変身した すがたの 顔
    if (face && FACES[face]) { ui.face.src = FACES[face]; ui.face.classList.remove('hidden'); }
    else ui.face.classList.add('hidden');
    // 長い 文は 会話ウィンドウの はばで 折りかえして、2行ずつ すすめる
    const pages = paginate(text);
    let page = 0;
    typeText(pages[0]);
    advanceResolve = () => {
      if (++page < pages.length) { typeText(pages[page]); return; }
      advanceResolve = null; talker = null; ui.dialog.classList.add('hidden'); resolve();
    };
  });
  const choose = (options, opt = {}) => new Promise(resolve => {
    openDialog(opt.speaker || '', opt);
    ui.dialog.classList.add('choosing');
    ui.choices.innerHTML = '';
    ui.choices.classList.toggle('three', options.length >= 3);
    options.forEach(label => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = label;
      b.addEventListener('click', ev => {
        ev.stopPropagation(); chooseResolve = null; ui.choices.innerHTML = '';
        ui.dialog.classList.add('hidden'); resolve(label);
      });
      ui.choices.appendChild(b);
    });
    chooseResolve = i => { const b = ui.choices.children[i]; if (b) b.click(); };
  });
  function openDialog(speaker, opt) {
    // ナレーションは 吹き出しでは なく、画面を 暗くして 白い 文字で まんなかに
    const narr = speaker === 'ナレーション';
    ui.dialog.classList.toggle('narration', narr);
    ui.dialog.classList.toggle('lab', speaker === '研究員');          // 研究員は 右下の カットの 吹き出し
    ui.speaker.textContent = speaker;
    ui.speaker.classList.toggle('hidden', !speaker || narr);
    ui.dialog.classList.toggle('bottom', opt.box === 'bottom');
    ui.dialog.classList.remove('hidden');
  }
  // 文を 会話ウィンドウの はばで 行に わけ、2行ずつの ページに する
  const measureCtx = document.createElement('canvas').getContext('2d');
  if (document.fonts) document.fonts.load("20px 'Enka Dot Gothic 24'", 'あ漢');   // 文の はばを はかる 前に フォントを 読みこんで おく
  const NO_LINE_START = '、。，．・：；？！ー…」』）〜～っゃゅょァィゥェォッャュョ';
  function paginate(text) {
    const cs = getComputedStyle(ui.text);
    const maxW = (ui.text.clientWidth || 600) * .94;   // 少し 余白を もたせて 折りかえす
    measureCtx.font = `${cs.fontSize} ${cs.fontFamily}`;
    const lines = [];
    for (const raw of text.split('\n')) {
      let line = '';
      for (const ch of Array.from(raw)) {
        if (line && measureCtx.measureText(line + ch).width > maxW && !NO_LINE_START.includes(ch)) {
          // 「 や（ が 行の おわりに のこらないように、いっしょに 次の 行へ
          let carry = '';
          while (line.length > 1 && '「『（'.includes(line[line.length - 1])) { carry = line[line.length - 1] + carry; line = line.slice(0, -1); }
          lines.push(line); line = carry + ch;
        } else line += ch;
      }
      lines.push(line);
    }
    const pages = [];
    for (let i = 0; i < lines.length; i += 2) pages.push(lines.slice(i, i + 2).join('\n'));
    return pages.length ? pages : [''];
  }
  function typeText(text) {
    clearInterval(typeTimer);
    const chars = Array.from(text); let n = 0;
    fullText = text; typing = true; ui.text.textContent = ''; ui.nextMark.classList.add('hidden');
    typeTimer = setInterval(() => { n++; ui.text.textContent = chars.slice(0, n).join(''); if (n >= chars.length) finishTyping(); }, 40 / timeScale);
  }
  function finishTyping() { clearInterval(typeTimer); typing = false; ui.text.textContent = fullText; ui.nextMark.classList.remove('hidden'); }
  function advance() {
    if (ui.dialog.classList.contains('hidden') || ui.dialog.classList.contains('choosing')) return;
    if (typing) { finishTyping(); return; }
    if (advanceResolve) advanceResolve();
  }

  const fadeOut = (color = 'black', ms = 600) => {
    ui.fade.style.background = color === 'white' ? '#ffffff' : '#151f10';
    ui.fade.style.transition = `opacity ${ms / timeScale}ms`;
    void ui.fade.offsetWidth;
    ui.fade.style.opacity = 1;
    return wait(ms);
  };
  const fadeIn = (ms = 600) => { ui.fade.style.transition = `opacity ${ms / timeScale}ms`; ui.fade.style.opacity = 0; return wait(ms); };
  const blink = async () => {
    eyelid = 1; ui.fade.style.transition = 'none'; ui.fade.style.opacity = 0;
    await tween(900, p => { eyelid = 1 - ease(p) * 0.55; });
    await tween(250, p => { eyelid = 0.45 + p * 0.55; });
    await wait(200);
    await tween(700, p => { eyelid = 1 - ease(p) * 0.8; });
    await tween(200, p => { eyelid = 0.2 + p * 0.8; });
    await tween(600, p => { eyelid = 1 - ease(p); });
    eyelid = 0;
  };
  const show = name => { shown[name] = true; };
  const hide = name => { delete shown[name]; };
  const monster = state => { monsterState = state; monsterDX = 0; captiveDX = 0; captiveDY = 0; if (state === 'eat') eatStart = performance.now(); };
  const police = state => { if (policeState === 'none') { policeDX = 0; policeDY = 0; } policeState = state; };
  const policeWalk = (dx, dy, ms) => { const fx = policeDX, fy = policeDY; return tween(ms, p => { policeDX = fx + dx * p; policeDY = fy + dy * p; }); };
  const monsterWalk = (dx, ms) => { const from = monsterDX; return tween(ms, p => { monsterDX = from + dx * p; }); };
  const captiveWalk = (dx, dy, ms) => { const fx = captiveDX, fy = captiveDY; return tween(ms, p => { captiveDX = fx + dx * p; captiveDY = fy + dy * p; }); };
  const throwItem = async (ms = 600) => {
    const x0 = player.x + 20, y0 = player.y - 10, x1 = 760, y1 = MON_Y + 15;
    await tween(ms, p => { thrown = { x: x0 + (x1 - x0) * p, y: y0 + (y1 - y0) * p, h: (1.1 + Math.sin(p * Math.PI) * 1.6) * CHAR, spin: p * 12 }; });
    thrown = null;
  };
  // カメラ：y は ほんものの ゲームと 同じ「画面の いちばん上の マップの 位置」
  let camTarget = null;
  const camera = (y, ms = 800) => {
    followCam = false;
    const from = camTarget ? camTarget : focusZ(player.y);
    const to = (y + 600) / 100;
    return tween(ms, p => { camTarget = from + (to - from) * ease(p); });
  };
  const follow = () => { followCam = true; camTarget = null; };
  const walkTo = (y, ms = 800) => {
    const from = player.y; player.moving = true; player.face = 0;
    return tween(ms, p => { player.y = from + (y - from) * p; player.t += 0.016; }).then(() => { player.moving = false; });
  };
  let toastTimer = null;
  const note = text => {
    ui.toast.textContent = text; ui.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 3500);
  };
  const end = text => { mode = 'end'; ui.endText.textContent = text; ui.ending.classList.remove('hidden'); };

  const walked = () => Math.hypot(player.x - STORY.playerStart.x, player.y - STORY.playerStart.y);
  // 時計に「タップして とめる」を 出して、とめるまで 待つ
  const stopAlarm = () => tapAt(() => watchM.position, 'タップして とめる');
  $('alarmGuide').addEventListener('click', e => { e.stopPropagation(); if (alarmResolve) alarmResolve(); });
  // けいさつが 体を 一周 まわすと、かいとう（黄色い人）に 変わる
  const policeTurn = async () => {

  // バケモノ（田野さんの デザイン画：頭巾を かぶった ような 幽霊の 形。すそと 背中は ぎざぎざ、

  const PLAZA = { x1: X(SM.plazaLeft), x2: X(SM.plazaRight), z1: LZ(SM.plazaTop), z2: LZ(SM.stairsTop) };
  function mottledPlane(w, d, segW, segD, palette) {

  function stopAuto() {
    auto = false; timeScale = 1; autoMove = null;
    screenEl.classList.remove('auto'); badgeEl.classList.add('hidden');
    cursorEl.classList.add('hidden'); cursorEl.classList.remove('pressed');
  }
  async function autopilot() {
    while (auto) {
      if (cakeActive) { await wait(500); if (auto && cakeActive) await cakeAutoCut(); continue; }
      if (peeking) { await wait(100); continue; }
      if (writing) {                                                          // オート：用意した 答えを 書きこむ
        await wait(900); if (!auto || !writing) continue;
        const list = STORY.autoWrites || [], o = writing.opt;
        $('writeInput').value = o.number ? (o.autoNumber || 8) : (list[autoWriteIdx++ % Math.max(1, list.length)] || 'いい子');
        await autoClick($('writeBox').querySelector('button'));
        continue;
      }
      if (alarmResolve) {
        await wait(700);
        if (auto && alarmResolve) await autoClick($('alarmGuide'));
        continue;
      }
      const d = ui.dialog, open = !d.classList.contains('hidden');
      if (open && d.classList.contains('choosing')) {
        await wait(800);
        if (!auto) break;
        const btns = [...ui.choices.children];
        if (!btns.length) continue;
        const want = (STORY.autoChoices || [])[autoChoiceIdx];
        const b = btns.find(b => want !== undefined && b.textContent.replace(/\n/g, '') === want.replace(/\n/g, ''));
        if (b) autoChoiceIdx++;
        await autoClick(b || btns[0]);
      } else if (open) {
        while (auto && typing) await wait(50);
        await wait(900 + Math.min(1200, fullText.length * 25));
        if (!auto || d.classList.contains('hidden') || d.classList.contains('choosing')) continue;
        const c = centerOf(ui.nextMark);
        await cursorTo(c.x, c.y);
        if (!auto) break;
        await clickFx();
        if (!auto) break;
        advance();
        await wait(150);
      } else if (mode === 'play') {
        await autoWalk();
      } else if (mode === 'end') {
        await wait(2500);
        if (!auto) break;
        if (await autoClick($('againBtn'))) stopAuto();
      } else {
        await wait(100);
      }
    }
  }
  // 画面の 上での 主人公の 位置（3D → 画面の px）
  const tmpV = new THREE.Vector3();
  function heroOnScreen() {
    tmpV.set(heroM.position.x, 1.1 * CHAR, heroM.position.z).project(cam);
    return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
  }
  async function autoWalk() {
    const anchor = () => { const h = heroOnScreen(); return { x: h.x + 170, y: h.y }; };
    let a = anchor();
    await cursorTo(a.x, a.y);
    if (!auto || mode !== 'play') return;
    cursorEl.classList.add('pressed');
    await wait(200);
    const t0 = performance.now();
    while (auto && mode === 'play') {
      let vx = Math.max(-1, Math.min(1, (AUTO_DOOR_X - player.x) / 80)) * 0.6, vy = -1;
      if ((area === 'home' || area === 'attic') && goal.length) { vx = goal[0][0] - heroX(); vy = goal[0][1] - heroZ(); }   // 家の中は 矢印の 道すじを たどる
      const n = Math.hypot(vx, vy); vx /= n; vy /= n;
      autoMove = { vx, vy };
      a = anchor();
      const k = Math.min(1, (performance.now() - t0) / 250);
      cur.x = a.x + vx * 90 * k; cur.y = a.y + vy * 90 * k;
      placeCursor();
      await wait(16);
    }
    autoMove = null;
    cursorEl.classList.remove('pressed');
  }
  $('autoBtn').addEventListener('click', startAuto);
  addEventListener('keydown', e => { if (auto && e.isTrusted) stopAuto(); }, true);
  addEventListener('pointerdown', e => { if (auto && e.isTrusted) stopAuto(); }, true);

  reset();
  requestAnimationFrame(loop);
  window.__lp = { get mode() { return mode; }, get player() { return player; }, advance, get flags() { return flags; }, monster, camera, show, runEvent, get area() { return area; }, get goal() { return goal; } };
  </script>
</body>
